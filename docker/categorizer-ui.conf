# Forwards the categoriser's settings page to 127.0.0.1:3010 on this Mac.
# The categoriser itself has no internet route (it is only on the "ai" network); this proxy only forwards inward.
server {
    listen 80;
    location / {
        proxy_pass http://categorizer:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;          # live job updates (server-sent events)
        proxy_read_timeout 1h;
    }
}
