<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Money advisor (test)</title>
<style>
  :root { --bg:#f7f7f5; --card:#fff; --text:#1d1d1b; --muted:#6b6b66; --line:#e3e3de; --me:#1f5f4a; --me-text:#fff; --warn:#a33a1c; }
  @media (prefers-color-scheme: dark) { :root { --bg:#151514; --card:#1f1f1d; --text:#ecece8; --muted:#a0a09a; --line:#33332f; --me:#2f7d63; --me-text:#fff; --warn:#e07a5a; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 -apple-system, system-ui, sans-serif; }
  main { max-width:760px; margin:0 auto; padding:16px; display:flex; flex-direction:column; min-height:100vh; gap:12px; }
  header { display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; }
  h1 { font-size:18px; margin:0; }
  .note { color:var(--muted); font-size:13px; }
  button { font:inherit; border:1px solid var(--line); background:var(--card); color:var(--text); border-radius:8px; padding:6px 12px; cursor:pointer; }
  button.primary { background:var(--me); color:var(--me-text); border-color:var(--me); }
  button:disabled { opacity:.5; cursor:default; }
  #log { flex:1; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:88%; padding:10px 12px; border-radius:12px; background:var(--card); border:1px solid var(--line); white-space:pre-wrap; }
  .me { align-self:flex-end; background:var(--me); color:var(--me-text); border-color:var(--me); }
  .meta { font-size:12px; color:var(--muted); margin-top:4px; }
  .warn { color:var(--warn); }
  form { display:flex; gap:8px; position:sticky; bottom:0; background:var(--bg); padding:8px 0 4px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 12px; display:flex; flex-direction:column; gap:6px; }
  .card .why { font-weight:600; }
  .card .text { white-space:pre-wrap; font-size:13px; color:var(--muted); max-height:9em; overflow:auto; }
  .card .actions { display:flex; gap:6px; flex-wrap:wrap; }
  .card.done { opacity:.55; }
  textarea { flex:1; font:inherit; padding:8px 10px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--text); resize:none; }
</style>
</head>
<body>
<main>
  <header>
    <div><h1>Money advisor</h1><div class="note">Temporary test page on this Mac. Answers come from your ledger through the local model; nothing leaves this computer.</div></div>
    <div><button id="digest">Weekly digest</button> <button id="alerts">Alerts</button> <button id="review">Review</button> <button id="clear">Clear</button></div>
  </header>
  <div id="log"></div>
  <form id="f">
    <textarea id="q" rows="2" placeholder="Ask, e.g. How much did I spend on food this month?"></textarea>
    <button class="primary" id="send">Send</button>
  </form>
</main>
<script>
const log = document.getElementById('log'), q = document.getElementById('q'), send = document.getElementById('send');
let history = [];
function add(text, me, meta, warn) {
  const d = document.createElement('div'); d.className = 'msg' + (me ? ' me' : ''); d.textContent = text;
  if (meta) { const m = document.createElement('div'); m.className = 'meta' + (warn ? ' warn' : ''); m.textContent = meta; d.appendChild(m); }
  log.appendChild(d); d.scrollIntoView({behavior: 'smooth', block: 'end'}); return d;
}
async function call(path, opts) {
  const r = await fetch(path, opts); const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.detail || ('HTTP ' + r.status)); return body;
}
async function ask(text) {
  add(text, true); const wait = add('Thinking… (the first answer after a restart can take a minute)');
  send.disabled = true;
  try {
    const body = await call('/api/v1/chat', {method: 'POST', headers: {'Content-Type': 'application/json'},
                                             body: JSON.stringify({message: text, history})});
    wait.remove();
    add(body.answer, false, body.checked ? 'Every amount checked against your data' + (body.tools_used.length ? ' · looked up: ' + body.tools_used.join(', ') : '')
                                         : 'The model\'s wording failed the number check, so these are the raw figures', !body.checked);
    history.push({role: 'user', content: text}, {role: 'assistant', content: body.answer}); history = history.slice(-6);
  } catch (e) { wait.remove(); add('Error: ' + e.message, false, null, true); }
  send.disabled = false;
}
document.getElementById('f').onsubmit = e => { e.preventDefault(); const t = q.value.trim(); if (t) { q.value = ''; ask(t); } };
q.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); document.getElementById('f').requestSubmit(); } });
document.getElementById('digest').onclick = async () => {
  try { const d = await call('/api/v1/digest'); add(d.text, false, 'Weekly digest ' + d.week + ' (computed by code)'); }
  catch (e) { add('Error: ' + e.message, false, null, true); }
};
document.getElementById('alerts').onclick = async () => {
  try { const d = await call('/api/v1/alerts');
        add(d.alerts.length ? d.alerts.map(a => '• [' + a.severity + '] ' + a.message).join('\n') : 'No alerts.', false, 'Alerts (fixed rules)'); }
  catch (e) { add('Error: ' + e.message, false, null, true); }
};
const REASONS = {
  unknown_sender: 'From a sender no bank profile knows', unparsed: 'A bank message I could not read',
  unknown_account: 'Account digits not in your accounts', ambiguous_match: 'Could be one of several payments',
  transfer_already_posted: 'Second half of a transfer that was already recorded',
  unpaired_transfer: 'Only one side of a transfer or card payment arrived', post_failed: 'Firefly refused this payment',
  card_due_unpaid: 'Card bill due date passed without the minimum paid'};
const rupees = p => '₹' + (p / 100).toLocaleString('en-IN', {minimumFractionDigits: 0, maximumFractionDigits: 2});
function button(label, fn) { const b = document.createElement('button'); b.textContent = label; b.onclick = fn; return b; }
async function act(card, id, action, body) {
  card.querySelectorAll('button').forEach(b => b.disabled = true);
  try {
    await call('/api/v1/review/' + id + '/' + action, {method: 'POST', headers: {'Content-Type': 'application/json'},
                                                     body: JSON.stringify(body || {})});
    card.classList.add('done'); card.querySelector('.actions').textContent = 'Done: ' + action;
  } catch (e) { card.querySelector('.actions').append(' Error: ' + e.message); card.querySelectorAll('button').forEach(b => b.disabled = false); }
}
document.getElementById('review').onclick = async () => {
  let d; try { d = await call('/api/v1/review'); } catch (e) { add('Error: ' + e.message, false, null, true); return; }
  if (!d.items.length) { add('The review queue is empty.', false, 'Review'); return; }
  add(d.items.length + ' item' + (d.items.length > 1 ? 's' : '') + ' need you:', false, 'Review queue');
  for (const it of d.items) {
    const card = document.createElement('div'); card.className = 'card';
    const why = document.createElement('div'); why.className = 'why';
    why.textContent = (REASONS[it.reason] || it.reason) + (it.detail ? ' (' + it.detail + ')' : '');
    card.append(why);
    if (it.message) { const t = document.createElement('div'); t.className = 'text';
      t.textContent = it.message.sender + ' · ' + it.message.sent_at.slice(0, 16).replace('T', ' ') + '\n' + it.message.text; card.append(t); }
    const s = it.suggestion || {};
    if (s.status === 'ok') { const g = document.createElement('div');
      g.textContent = 'AI reading (checked): ' + s.direction + ' ' + rupees(s.amount_paise) + ' on account ' + s.account_last4 + (s.counterparty ? ', ' + s.counterparty : ''); card.append(g); }
    const a = document.createElement('div'); a.className = 'actions'; card.append(a);
    if (s.status === 'ok') a.append(button('Accept AI reading', () => act(card, it.id, 'accept')));
    if (it.reason === 'ambiguous_match') {
      for (const c of it.candidate_details) a.append(button('Same as ' + rupees(c.amount_paise) + ' ' + c.occurred_at.slice(0, 10) + ' ' + (c.counterparty || ''), () => act(card, it.id, 'resolve', {entry_id: c.id})));
      a.append(button('It is a new payment', () => act(card, it.id, 'resolve', {entry_id: null})));
    }
    if (it.reason === 'unpaired_transfer' || it.reason === 'post_failed') a.append(button('Post it as it is', () => act(card, it.id, 'resolve', {post: true})));
    if (it.message && ['unknown_sender', 'unparsed', 'unknown_account'].includes(it.reason)) a.append(button('Read again', () => act(card, it.id, 'reparse')));
    a.append(button(it.reason === 'card_due_unpaid' ? 'I paid it, dismiss' : 'Ignore (not a payment)', () => act(card, it.id, 'ignore')));
    log.appendChild(card); card.scrollIntoView({behavior: 'smooth', block: 'end'});
  }
};
document.getElementById('clear').onclick = () => { history = []; log.innerHTML = ''; };
</script>
</body>
</html>
