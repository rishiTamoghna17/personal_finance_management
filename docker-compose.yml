# Personal finance agent - M1 stack.
# Only Firefly III and the bridge publish ports, and only on 127.0.0.1.
# HTTPS and the reverse proxy arrive in M7.

# Container logs are capped so a busy month cannot fill the disk (M7).
x-logging: &logging
  driver: json-file
  options: {max-size: "10m", max-file: "3"}

x-bridge: &bridge
  build: ./bridge
  # One image for bridge, worker and beat, so a rebuild always updates all three (before M7 each had its own copy).
  image: personal-finance-bridge:local
  restart: unless-stopped
  environment: &bridge-env
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set in .env}
    DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
    DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,bridge}
    BRIDGE_API_TOKEN: ${BRIDGE_API_TOKEN:?set in .env}
    BRIDGE_DB_HOST: postgres
    BRIDGE_DB_PORT: "5432"
    BRIDGE_DB_NAME: ${BRIDGE_DB_NAME:-bridge}
    BRIDGE_DB_USER: ${BRIDGE_DB_USER:-bridge}
    BRIDGE_DB_PASSWORD: ${BRIDGE_DB_PASSWORD:?set in .env}
    REDIS_URL: redis://redis:6379/0
    FIREFLY_BASE_URL: http://firefly:8080
    FIREFLY_ACCESS_TOKEN: ${FIREFLY_ACCESS_TOKEN:-}
    BRIDGE_SMS_HMAC_SECRET: ${BRIDGE_SMS_HMAC_SECRET:?set in .env}
    BRIDGE_OWN_VPAS: ${BRIDGE_OWN_VPAS:-}
    BRIDGE_DEFAULT_ACCOUNTS: ${BRIDGE_DEFAULT_ACCOUNTS:-}
    BRIDGE_ENCRYPTION_KEY: ${BRIDGE_ENCRYPTION_KEY:?set in .env}
    INGEST_LEDGER_START: ${INGEST_LEDGER_START:-2026-11-01}
    STATEMENT_DIR: /data/statements
    LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
    LLM_MODEL: ${LLM_MODEL:-qwen2.5:3b}
    LLM_OLLAMA_URL: ${LLM_OLLAMA_URL:-http://ollama:11434}
    LLM_API_KEY: ${LLM_API_KEY:-}
    GOOGLE_OAUTH_TESTING: ${GOOGLE_OAUTH_TESTING:-1}
    GDRIVE_CONNECTED_AT: ${GDRIVE_CONNECTED_AT:-}
    PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
    GOOGLE_WEB_CLIENT_1_ID: ${GOOGLE_WEB_CLIENT_1_ID:-}
    GOOGLE_WEB_CLIENT_1_SECRET: ${GOOGLE_WEB_CLIENT_1_SECRET:-}
    GOOGLE_WEB_CLIENT_2_ID: ${GOOGLE_WEB_CLIENT_2_ID:-}
    GOOGLE_WEB_CLIENT_2_SECRET: ${GOOGLE_WEB_CLIENT_2_SECRET:-}
    TZ: Asia/Kolkata
  networks: [internal, ai]
  logging: *logging
  volumes:
    - bridge_data:/data
    - backup_status:/backup-status:ro  # last backup result, for the health alert (M7)
    - backup_secrets:/backup-secrets   # Drive sign-in renewed from the phone, handed to the backup job (M7)
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    logging: *logging
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      FIREFLY_DB_NAME: ${FIREFLY_DB_NAME:-firefly}
      FIREFLY_DB_USER: ${FIREFLY_DB_USER:-firefly}
      FIREFLY_DB_PASSWORD: ${FIREFLY_DB_PASSWORD:?set in .env}
      BRIDGE_DB_NAME: ${BRIDGE_DB_NAME:-bridge}
      BRIDGE_DB_USER: ${BRIDGE_DB_USER:-bridge}
      BRIDGE_DB_PASSWORD: ${BRIDGE_DB_PASSWORD:?set in .env}
      TZ: Asia/Kolkata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    logging: *logging
    image: redis:7-alpine
    restart: unless-stopped
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  firefly:
    logging: *logging
    image: fireflyiii/core:version-6.7.9
    restart: unless-stopped
    stop_signal: SIGINT
    environment:
      APP_KEY: ${FIREFLY_APP_KEY:?set in .env}
      APP_URL: ${FIREFLY_APP_URL:-http://localhost:8080}
      SITE_OWNER: ${FIREFLY_SITE_OWNER:-owner@localhost}
      DEFAULT_LANGUAGE: en_GB
      DEFAULT_LOCALE: en_IN
      TZ: Asia/Kolkata
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: ${FIREFLY_DB_NAME:-firefly}
      DB_USERNAME: ${FIREFLY_DB_USER:-firefly}
      DB_PASSWORD: ${FIREFLY_DB_PASSWORD:?set in .env}
      STATIC_CRON_TOKEN: ${FIREFLY_STATIC_CRON_TOKEN:?set in .env}
      TRUSTED_PROXIES: ""
      ALLOW_WEBHOOKS: "true"  # used only by the internal AI categoriser webhook (M4)
    volumes:
      - firefly_upload:/var/www/html/storage/upload
    ports:
      - "127.0.0.1:8080:8080"
    networks: [internal, ai]
    depends_on:
      postgres:
        condition: service_healthy

  firefly-cron:
    logging: *logging
    image: alpine:3.22
    restart: unless-stopped
    init: true
    environment:
      STATIC_CRON_TOKEN: ${FIREFLY_STATIC_CRON_TOKEN:?set in .env}
      TZ: Asia/Kolkata
    command:
      - sh
      - -c
      - >-
        apk add --no-cache tzdata >/dev/null &&
        (ln -sf /usr/share/zoneinfo/$$TZ /etc/localtime || true) &&
        echo "0 3 * * * wget -qO- http://firefly:8080/api/v1/cron/$$STATIC_CRON_TOKEN; echo" | crontab - &&
        exec crond -f -L /dev/stdout
    networks: [internal]
    depends_on: [firefly]

  # M4: local AI model server. Internal network only (no published port); models kept in the ollama_models volume.
  # Runs on the CPU (Docker on a Mac has no GPU), so a small model is used by default.
  ollama:
    logging: *logging
    image: ollama/ollama:0.40.16
    restart: unless-stopped
    environment:
      # Keep the model loaded: answers come without the 1-minute load, and on Oracle the server never looks idle (M7).
      OLLAMA_KEEP_ALIVE: "-1"
    volumes:
      - ollama_models:/root/.ollama
    # To download another model, attach it to `internal` for the download only (see README).
    networks: [ai]

  # M4: AI categoriser (FireflyIII-AI-Categorizer, AGPL-3.0), pinned by digest because only `latest` is published.
  # It has no login, so its settings page is published on 127.0.0.1 only. It talks to the ollama container.
  categorizer:
    logging: *logging
    image: ghcr.io/ejagombar/fireflyiii-ai-categorizer@sha256:453e908c448fd406ce30a890108abd1f2b450c30ad86c39a3cbcb38326a8f0f7
    restart: unless-stopped
    environment:
      FIREFLY_URL: http://firefly:8080
      FIREFLY_PERSONAL_TOKEN: ${CATEGORIZER_FIREFLY_TOKEN:?set in .env}
      AI_PROVIDER: openai
      OPENAI_BASE_URL: ${LLM_OPENAI_BASE_URL:-http://ollama:11434/v1}
      OPENAI_API_KEY: ${LLM_API_KEY:-ollama}
      OPENAI_MODEL: ${LLM_MODEL:-qwen2.5:3b}
      HISTORY_LOOKBACK_DAYS: "180"
      CONFIG_FILE: /data/config.json
    volumes:
      - categorizer_data:/data
    networks: [ai]
    depends_on: [firefly, ollama]

  # Publishes the categoriser's settings page on 127.0.0.1:3010 (3000 is taken by another program on this Mac).
  # Needed because Docker does not publish ports of a container that is only on an internet-less network.
  categorizer-ui:
    logging: *logging
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./docker/categorizer-ui.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:3010:80"
    networks: [internal, ai]
    depends_on: [categorizer]

  # M6: temporary local test chat page for the advisor, until the Phase 2 app exists. 127.0.0.1 only.
  # It adds the bridge token itself and passes only /api/v1/chat, /digest and /alerts.
  advisor-ui:
    logging: *logging
    image: nginx:1.27-alpine
    restart: unless-stopped
    environment:
      BRIDGE_API_TOKEN: ${BRIDGE_API_TOKEN:?set in .env}
      NGINX_ENVSUBST_FILTER: "^BRIDGE_API_TOKEN$$"
    volumes:
      - ./docker/advisor-ui/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./docker/advisor-ui/index.html:/usr/share/nginx/html/index.html:ro
    ports:
      - "127.0.0.1:3020:80"
    networks: [internal]
    depends_on: [bridge]

  # M7: private HTTPS for the phone (and later the app) through Tailscale, without installing anything on the host.
  # https://finance.<tailnet>.ts.net -> bridge; :8443 -> the test chat page. Reachable only from your own Tailscale
  # devices (serve, never funnel). Needs TS_AUTHKEY once (scripts/set-secret.sh TS_AUTHKEY); state kept in a volume.
  tailscale:
    image: tailscale/tailscale:v1.104.7
    hostname: finance
    restart: unless-stopped
    logging: *logging
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_HOSTNAME: finance
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - tailscale_state:/var/lib/tailscale
      - ./docker/tailscale/serve.json:/config/serve.json:ro
    networks: [internal]
    depends_on: [bridge, advisor-ui]

  bridge:
    <<: *bridge
    command: >-
      sh -c "python manage.py migrate --noinput &&
      gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 180 --access-logfile -"
    ports:
      - "127.0.0.1:8000:8000"

  worker:
    <<: *bridge
    command: celery -A config worker --loglevel=INFO --concurrency=2

  beat:
    <<: *bridge
    command: celery -A config beat --loglevel=INFO --schedule=/tmp/celerybeat-schedule

  # M7: nightly encrypted backup (restic) of both databases, the bridge files and the categoriser settings,
  # encrypted here and stored in Google Drive (drive.file access only). See docs/deployment.md.
  backup:
    build: ./docker/backup
    image: personal-finance-backup:local
    restart: unless-stopped
    logging: *logging
    environment:
      TZ: Asia/Kolkata
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      FIREFLY_DB_NAME: ${FIREFLY_DB_NAME:-firefly}
      BRIDGE_DB_NAME: ${BRIDGE_DB_NAME:-bridge}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:?set in .env}
      RESTIC_REPOSITORY: rclone:gdrive:personal-finance-backups
      RCLONE_CONFIG_GDRIVE_TYPE: drive
      RCLONE_CONFIG_GDRIVE_SCOPE: drive.file
      RCLONE_CONFIG_GDRIVE_CLIENT_ID: ${GDRIVE_CLIENT_ID:-}
      RCLONE_CONFIG_GDRIVE_CLIENT_SECRET: ${GDRIVE_CLIENT_SECRET:-}
      RCLONE_CONFIG_GDRIVE_TOKEN: ${GDRIVE_TOKEN:-}
    volumes:
      - bridge_data:/backup/bridge_data:ro
      - categorizer_data:/backup/categorizer_data:ro
      - backup_status:/status
      - backup_secrets:/secrets:ro
    networks: [internal]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  firefly_upload:
  bridge_data:
  categorizer_data:
  ollama_models:
  backup_status:
  tailscale_state:
  backup_secrets:

networks:
  internal:
    driver: bridge
  # No route to the internet at all (internal: true). The AI services live only here, so even a bug
  # or a wrong setting cannot send transaction text out of this machine.
  ai:
    driver: bridge
    internal: true
