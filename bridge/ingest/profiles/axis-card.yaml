# Axis Bank credit cards. Written from the owner's real SMS (2026-11-13). Add a pattern only from a real sample.
# "Avl limit" is never captured: a credit limit is not money you have (rule 8).
id: axis-card
# AXISBK may also send Axis *bank account* SMS. One header maps to one profile, so if the owner
# adds an Axis bank account, its patterns go in this file too (and this profile becomes "axis").
account_kind: card
# Sender seen on the owner's phone: JD-AXISBK-S (2026-11-13).
senders: [AXISBK]
date_formats: ["%d-%m-%y"]
patterns:
  # Bill due reminder. Not a payment. (The due date may feed due-date alerts in M5/M6.)
  - id: bill-due-reminder
    type: ignore
    reason: card bill due reminder
    match: 'Payment of INR [\d,]+(?:\.\d+)? for Axis Bank Credit Card no\. X+\d{4} is due on'
  - id: statement-generated
    type: ignore
    reason: card statement generated
    match: 'Your statement for Axis Bank Credit Card no\. X+\d{4} is generated'
  - id: declined
    type: ignore
    reason: declined transaction
    match: 'Transaction on Axis Bank Credit Card no\. X+\d{4} has been declined'
  # "Spent INR 274.77 using Axis Bank Credit Card no. XX1234 on 21-10-26 20:24:43 IST at ZOMATO CYBS. Avl limit: ..."
  - id: spend
    direction: debit
    channel: card
    match: 'Spent INR (?P<amount>[\d,]+(?:\.\d+)?) using Axis Bank Credit Card no\. X+(?P<account>\d{4}) on (?P<date>\d{2}-\d{2}-\d{2}) (?P<time>\d{2}:\d{2}:\d{2}) IST at (?P<counterparty>.+?)\. Avl limit'
  # "Payment of INR 99 has been received towards your Axis Bank Credit Card XX1234 on 12-11-26 - Axis Bank"
  # The card side of a bill payment: paired with the bank-side debit, never counted as income.
  - id: payment-received
    direction: credit
    channel: other
    kind: card_payment
    match: 'Payment of INR (?P<amount>[\d,]+(?:\.\d+)?) has been received towards your Axis Bank Credit Card X+(?P<account>\d{4}) on (?P<date>\d{2}-\d{2}-\d{2})'
  # Older wording: "Spent INR 1234 Axis Bank Card no. XX1234 01-02-26 10:11:12 IST FLIPKART PA Avl Limit: ..."
  - id: spend-short
    direction: debit
    channel: card
    match: 'Spent INR (?P<amount>[\d,]+(?:\.\d+)?) Axis Bank Card no\. X+(?P<account>\d{4}) (?P<date>\d{2}-\d{2}-\d{2}) (?P<time>\d{2}:\d{2}:\d{2}) IST (?P<counterparty>.+?) Avl Limit'
  - id: security-notice
    type: ignore
    reason: security notice
    match: 'The safety & security of your A/c is most important to us'
  - id: consent-notice
    type: ignore
    reason: consent management notice
    match: 'You have successfully updated your consent management request'
  - id: limits-updated
    type: ignore
    reason: card settings changed
    match: 'usage & transaction limit options have been updated on Axis Bank Credit Card'
  - id: app-registration
    type: ignore
    reason: app registration notice
    match: '(UPI registration on Google Pay has started|Registration for .{1,30} app has started)'
  - id: card-application
    type: ignore
    reason: card application notice
    match: '(video KYC|resume KYC) for (your )?Axis Bank Credit Card application'
