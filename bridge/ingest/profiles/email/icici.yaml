# ICICI Bank alert emails. Written from the owner's real emails (2026-11-13). Add a pattern only from a real email.
id: icici-email
account_kind: bank
senders: [icici.bank.in, icicibank.com]
date_formats: ["%d-%b-%y"]
patterns:
  - id: statement
    type: ignore
    reason: statement email (its PDF is handled by the statement import)
    match: '^ICICI Bank Statement from|e-statement for'
  - id: payment-initiated
    type: ignore
    reason: salary or vendor payment initiated, not yet credited (the credit email follows)
    match: 'We have initiated a payment of Rs'
  - id: unconfirmed-upi
    type: ignore
    reason: unconfirmed UPI payment notice (the SMS copy goes to review)
    match: 'unable to reach you to confirm the transaction'
  # "We have credited your account XXXXXXXX1234 with Rs 26667.00 (Rupees ...) through payment reference number 1234567890 on behalf of EMPLOYER LLP."
  - id: e-payment-credit
    direction: credit
    channel: other
    # Also: "with Rs126270(Rupees ...) through Payment Ref No. 1234567890 on behalf of ..."
    match: 'We have credited your account X+(?P<account>\d{3,4}) with Rs\.? ?(?P<amount>[\d,]+(?:\.\d+)?) ?\(.*?\) through payment (?:reference number|ref no\.) (?P<ref>\w+) on behalf of (?P<counterparty>.+?)\.'
  # "Your ICICI Bank Account XX378 has been credited with INR 12 on 30-Sep-26. Info: XX378:Int.Pd:01-07-2026 to 30-09-2026."
  - id: account-credit
    direction: credit
    channel: other
    match: 'Your ICICI Bank Account X+(?P<account>\d{3,4}) has been credited with INR (?P<amount>[\d,]+(?:\.\d+)?) on (?P<date>\d{2}-[A-Za-z]{3}-\d{2})\. Info: (?P<counterparty>.+?)\. NEVER SHARE'
  # "A purchase of Rs. 123.45 has been made using your Debit Card linked to ICICI Bank Account XX378 on 01-Jun-26.
  #  Info: VIN*MERCHANT . The Available Balance in your account is Rs. 1,234.56."
  - id: debit-card-purchase
    direction: debit
    channel: card
    match: 'A purchase of Rs\.? ?(?P<amount>[\d,]+(?:\.\d+)?) has been made using your Debit Card linked to ICICI Bank Account X+(?P<account>\d{3,4}) on (?P<date>\d{2}-[A-Za-z]{3}-\d{2})\. Info: (?P<counterparty>.+?) ?\. The Available Balance in your account is Rs\.? ?(?P<balance>[\d,]+(?:\.\d+)?)'
