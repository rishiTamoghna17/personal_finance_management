# SBI Card emails. Written from the owner's real emails (2026-11-13). Add a pattern only from a real email.
# Limits are never captured: a credit limit is not money you have (rule 8).
id: sbi-card-email
account_kind: card
senders: [sbicard.com]
date_formats: ["%d/%m/%y", "%d-%m-%y"]
patterns:
  - id: statement
    type: ignore
    reason: statement email (its PDF is handled by the statement import)
    match: 'SBI Card Monthly Statement|Details of Merchant EMI booked'
  - id: upcoming-emandate
    type: ignore
    reason: upcoming e-mandate charge (not charged yet)
    match: 'is due on .+ will be processed through SBI Credit Card ending'
  # "Rs.123.45 spent on your SBI Credit Card ending 1234 at ZOMATO on 01/11/26."
  - id: spend
    direction: debit
    channel: card
    match: 'Rs\.? ?(?P<amount>[\d,]+(?:\.\d+)?) spent on your SBI Credit Card ending (?P<account>\d{4}) at (?P<counterparty>.+?) on (?P<date>\d{2}/\d{2}/\d{2})'
  # "Transaction of Rs.69.00 at AMAZON against E-mandate (SiHub ID - <id>) registered by you at merchant has been debited
  #  to your SBI Credit Card ending 1234 on 06-11-26."
  - id: emandate-debit
    direction: debit
    channel: card
    match: 'Transaction of Rs\.? ?(?P<amount>[\d,]+(?:\.\d+)?) at (?P<counterparty>.+?) against E-mandate \(SiHub ID - \S+\) registered by you at merchant has been debited to your SBI Credit Card ending (?P<account>\d{4}) on (?P<date>\d{2}-\d{2}-\d{2})'
